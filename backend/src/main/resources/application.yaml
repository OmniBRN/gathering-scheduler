
server:
  port: "3000"
spring:
    application:
      name: gatheringschedule
    
    config:
      import:
        - optional:file:../compose/.env[.properties]
        - optional:file:compose/.env[.properties]

    datasource:
      url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
      username: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
      properties:
        hibernate:
          format_sql: true

    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true

    logging:
      level:
        org.hibernate.SQL: debug
    